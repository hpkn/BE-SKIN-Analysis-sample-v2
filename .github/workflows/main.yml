# PRODUTION RELEASE SCRIPT
name: Production Release
on:
    push:
        branches: [main]
jobs:
    # China Server
    china-build:
        runs-on: [ubuntu-latest]

        if: (github.ref == 'refs/heads/main')
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Install sshpass
              run: sudo apt-get update && sudo apt-get install -y sshpass

            - name: SSH into server and run sync.sh
              run: |
                  sshpass -p ${{ secrets.SERVER_PASSWORD }} ssh -o StrictHostKeyChecking=no ubuntu@1.0.0.0 << EOF
                    cd /home/ubuntu/repositories/BE-Analysis-sample-v2/
                    # Check if the working directory is clean
                    if git status --porcelain | grep .; then
                      echo "Working directory is not clean, commit changes"
                      git add .
                      git commit -m "Committing changes before pulling from remote"
                    fi

                    echo "pull changes from main"
                    git pull origin main
                    sudo bash -s < /home/ubuntu/repositories/BE-Analysis-sample-v2/sync.sh
                  EOF

    # Ohio
    ohio-build:
        runs-on: [ubuntu-latest]

        if: (github.ref == 'refs/heads/main')
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.5.3
              with:
                  ssh-private-key: ${{ secrets.OHIO_KEY }}

            - name: SSH into server and run sync.sh
              run: |
                  ssh -o StrictHostKeyChecking=no -T -i <(echo "${{ secrets.OHIO_KEY }}") ubuntu@127.0.0.1 << EOF
                    cd /home/ubuntu/repositories/BE-CNDP-Analysis-sample-v2/
                    # Check if the working directory is clean
                    if git status --porcelain | grep .; then
                      echo "Working directory is not clean, commit changes"
                      git add .
                      git commit -m "Committing changes before pulling from remote"
                    fi

                    echo "pull changes from main"
                    git pull origin main
                    sudo bash -s < /home/ubuntu/repositories/BE-CNDP-SKIN-v2/sync.sh
                  EOF
    # Europe server
    europe-build:
        runs-on: [ubuntu-latest]

        if: (github.ref == 'refs/heads/main')
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v3

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.5.3
              with:
                  ssh-private-key: ${{ secrets.GLOBAL_KEY }}

            - name: SSH into server and run sync.sh
              run: |
                  ssh -o StrictHostKeyChecking=no -T -i <(echo "${{ secrets.GLOBAL_KEY }}") ubuntu@127.0.0.1 << EOF
                    cd /home/ubuntu/repositories/BE-SKIN-Analysis-sample-v2/
                    # Check if the working directory is clean
                    if git status --porcelain | grep .; then
                      echo "Working directory is not clean, commit changes"
                      git add .
                      git commit -m "Committing changes before pulling from remote"
                    fi

                    echo "pull changes from main"
                    git pull origin main
                    sudo bash -s < /home/ubuntu/repositories/BE-SKIN-Analysis-sample-v2/sync.sh
                  EOF

    # Removing Old action
    cleanup-action:
        runs-on: [ubuntu-latest]
        needs: europe-build
        continue-on-error: true
        steps:
            - name: Cleaning existing Actions
              run: |
                  echo "Removing old workflow runs..."
                  RUNS=$(curl -s -X GET -G "https://api.github.com/repos/${{ github.repository }}/actions/runs" \
                          -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                          -H "Accept: application/vnd.github.v3+json" \
                          | jq -r '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id')

                  for run in $RUNS; do
                    echo "Deleting workflow run $run"
                    curl -X DELETE -G "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run" \
                      -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
                      -H "Accept: application/vnd.github.v3+json"
                  done

